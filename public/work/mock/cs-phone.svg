<text x="18" y="166" font-size="46" fill="#575757" textLength="252" lengthAdjust="spacingAndGlyphs">Listen first.</text>
<text x="18" y="214" font-size="46" fill="#575757" textLength="269" lengthAdjust="spacingAndGlyphs">Then respond.</text>
<text x="18" y="272" font-size="16" fill="#6E6C72" textLength="296" lengthAdjust="spacingAndGlyphs">Guidance, tools and training for risk</text>
<text x="18" y="296" font-size="16" fill="#6E6C72" textLength="353" lengthAdjust="spacingAndGlyphs">communication and community engagement.</text>
