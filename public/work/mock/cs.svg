<text x="778" y="460" font-size="14" fill="#6E6C72" textLength="269" lengthAdjust="spacingAndGlyphs">Current outbreak strain: Bundibugyo virus</text>
<text x="778" y="494" font-size="16" fill="#6E6C72" textLength="575" lengthAdjust="spacingAndGlyphs">An Ebola outbreak was confirmed in the Democratic Republic of the Congo and</text>
<text x="778" y="518" font-size="16" fill="#6E6C72" textLength="553" lengthAdjust="spacingAndGlyphs">in Uganda in May 2026. The Bundibugyo species of Ebola involved is one for</text>
<text x="778" y="542" font-size="16" fill="#6E6C72" textLength="573" lengthAdjust="spacingAndGlyphs">which there is no vaccine or specific treatment, though work is ongoing to test</text>
<text x="778" y="566" font-size="16" fill="#6E6C72" textLength="163" lengthAdjust="spacingAndGlyphs">promising candidates.</text>
<text x="778" y="615" font-size="17" fill="#575757" font-weight="600" textLength="100" lengthAdjust="spacingAndGlyphs">Open the kit</text>
