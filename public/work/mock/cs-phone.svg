<text x="70" y="368" font-size="16" fill="#8A888E" textLength="300" lengthAdjust="spacingAndGlyphs">Search by emergency, country or top</text>
<rect x="18.75" y="420.75" width="352.5" height="381.5" rx="16" fill="#FFFFFF" stroke="#BDBCC0" stroke-width="1.5"></rect>
