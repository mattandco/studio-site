<text x="56" y="392" font-size="84" fill="#575757" textLength="340" lengthAdjust="spacingAndGlyphs">Listen first.</text>
<text x="56" y="478" font-size="84" fill="#575757" textLength="437" lengthAdjust="spacingAndGlyphs">Then respond.</text>
<text x="56" y="525" font-size="21" fill="#6E6C72" textLength="509" lengthAdjust="spacingAndGlyphs">Guidance, tools and training for risk communication and</text>
