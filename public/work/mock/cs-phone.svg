<text x="66" y="461" font-size="13" fill="#575757" font-weight="600" letter-spacing="2" textLength="142" lengthAdjust="spacingAndGlyphs">ACTIVE RESPONSE</text>
<text x="46" y="507" font-size="32" fill="#575757" textLength="170" lengthAdjust="spacingAndGlyphs">Ebola disease</text>
<text x="46" y="534" font-size="13" fill="#6E6C72" textLength="256" lengthAdjust="spacingAndGlyphs">Current outbreak strain: Bundibugyo virus</text>
<text x="46" y="566" font-size="15" fill="#6E6C72">An Ebola outbreak was confirmed in the</text>
<text x="46" y="590" font-size="15" fill="#6E6C72">Democratic Republic of the Congo and</text>
<text x="46" y="614" font-size="15" fill="#6E6C72">in Uganda in May 2026. The Bundibugyo</text>
<text x="46" y="638" font-size="15" fill="#6E6C72">species of Ebola involved is one for</text>
<text x="46" y="662" font-size="15" fill="#6E6C72">which there is no vaccine or specific</text>
<text x="46" y="686" font-size="15" fill="#6E6C72">treatment, though work is ongoing to</text>
<text x="46" y="710" font-size="15" fill="#6E6C72">test promising candidates.</text>
<text x="46" y="761" font-size="17" fill="#575757" font-weight="600" textLength="100" lengthAdjust="spacingAndGlyphs">Open the kit</text>
<text x="156" y="761" font-size="17" fill="#6E6C72" textLength="104" lengthAdjust="spacingAndGlyphs">64 resources</text>
<text x="271" y="761" font-size="17" fill="#575757">→</text>
